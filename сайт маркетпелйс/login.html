<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - SARSHIM SHOP</title>
    <link rel="stylesheet" href="index.css">
</head>
<body class="dark-theme">
    <header class="header">
        <div class="header__container container">
            <a href="index.html" class="header__logo">
                <img src="лого саршсим.png" alt="SARSHIM SHOP" class="header__logo-img">
            </a>
            <button class="burger" id="burger">
                <span class="burger__line"></span>
                <span class="burger__line"></span>
                <span class="burger__line"></span>
            </button>
            <nav class="nav" id="nav">
                <ul class="nav__list">
                    <li><a href="index.html#search" class="nav__link">Поиск</a></li>
                    <li><a href="login.html" class="nav__link">Войти</a></li>
                    <li><a href="profile.html" class="nav__link">Личный кабинет</a></li>
                    <li><a href="catalog.html" class="nav__link">Каталог</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="auth">
        <div class="auth__card">
            <h1 class="auth__title">Вход в личный кабинет</h1>
            <form class="form" action="profile.html">
                <div class="form__group">
                    <label for="email" class="form__label">E-mail *</label>
                    <input type="email" id="email" class="form__input" required>
                </div>
                <div class="form__group">
                    <label for="password" class="form__label">Пароль *</label>
                    <input type="password" id="password" class="form__input" required>
                </div>
                <button type="submit" class="btn">Войти</button>
                <a href="#" class="form__link">Восстановить пароль</a>
                <p style="text-align:center;color:var(--text-muted);font-size:14px;">
                    Нет аккаунта? <a href="register.html" style="color:var(--accent);">Зарегистрироваться</a>
                </p>
            </form>
        </div>
    </section>

    <script src="main.js"></script>
</body>
</html>
